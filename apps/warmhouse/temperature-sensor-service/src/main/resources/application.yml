server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: temperature-sensor-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

service:
  id: ${random.uuid}

logging:
  level:
    com.sensor.service: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"