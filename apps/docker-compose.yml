#version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smarthome
    ports:
      - "5433:5432"  # внутренний порт postgres по умолчанию 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  temperature-api:
    ## тут нужно добавить приложение
    build: ./temperature-api
    container_name: temperature-api
    ports:
      - "8081:8081"
    #    environment:
    #      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/orders
    networks:
      - smarthome-network


  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:

        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:


networks:
  smarthome-network:
    driver: bridge