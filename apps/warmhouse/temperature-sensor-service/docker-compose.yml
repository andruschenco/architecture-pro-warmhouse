version: '3.8'

services:
  sensor-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temperature-sensor-service
    ports:
      - "8082:8082"
    environment:
      - TZ=Europe/Moscow
      - JAVA_OPTS=-Xmx256m -Xms128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sensor-network

networks:
  sensor-network:
    driver: bridge